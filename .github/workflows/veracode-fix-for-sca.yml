name: Veracode Fix for SCA

run-name: Veracode Fix for SCA - ${{ github.event.client_payload.repository.name }}

on:
  repository_dispatch:
    types:
      - veracode-fix-for-sca

jobs:
  cleanup:
    if: github.event_name == 'repository_dispatch'
    uses: ./.github/workflows/veracode-clean-up.yml
    with:
      runs_on: ${{ github.event.client_payload.user_config.default_runs_on }}

  create_metadata:
    if: github.event_name == 'repository_dispatch'
    needs: cleanup
    uses: ./.github/workflows/veracode-metadata.yml
    with:
      event_type: ${{ github.event.client_payload.event_type }}
      repository_name: ${{ github.event.client_payload.repository.name }}
      repository_owner: ${{ github.event.client_payload.repository.owner }}
      pull_request_num: ${{ github.event.client_payload.issue_number }}
      branch: ${{ github.event.client_payload.repository.branch }}
      head_sha: ${{ github.event.client_payload.sha }}

  fix-for-sca-action:
    runs-on: ${{ fromJSON(github.event.client_payload.user_config.default_runs_on) }}
    steps:
    - name: Create artifact directory
      run: mkdir -p ./veracode_artifact_directory

    - name: Download SCA scan artifact from source repository
      id: download-artifact
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.event.client_payload.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');
          const owner = '${{ github.event.client_payload.repository.owner }}';
          const repo = '${{ github.event.client_payload.repository.name }}';
          const runId = ${{ github.event.client_payload.workflow_run_id }};
          const artifactDir = './veracode_artifact_directory';

          console.log(`\n📦 Downloading SCA artifacts from ${owner}/${repo} run ${runId}\n`);

          try {
            // List artifacts for this run
            const listResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
              per_page: 50
            });

            console.log('Available artifacts:');
            if (!listResponse.data.artifacts || listResponse.data.artifacts.length === 0) {
              console.log('❌ No artifacts found in this workflow run');
              core.setOutput('success', 'false');
              return;
            }

            listResponse.data.artifacts.forEach(artifact => {
              console.log(`  - ${artifact.name} (ID: ${artifact.id})`);
            });

            // Find SCA results artifact
            const scaArtifact = listResponse.data.artifacts.find(a =>
              a.name && a.name.includes('sca-scan-results')
            );

            if (!scaArtifact) {
              console.log('\n❌ No SCA scan results artifact found');
              core.setOutput('success', 'false');
              return;
            }

            console.log(`\n✅ Found SCA artifact: ${scaArtifact.name}`);

            // Download the artifact as zip
            console.log(`\n⏳ Downloading artifact ${scaArtifact.id}...`);
            const downloadResponse = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: scaArtifact.id,
              archive_format: 'zip'
            });

            // Create directory if it doesn't exist
            fs.mkdirSync(artifactDir, { recursive: true });

            // Write the zip file
            const zipPath = path.join(artifactDir, 'artifact.zip');
            fs.writeFileSync(zipPath, Buffer.from(downloadResponse.data));
            console.log(`✅ Zip file saved to ${zipPath}`);

            // Extract the zip file
            const AdmZip = require('adm-zip');
            const zip = new AdmZip(zipPath);
            zip.extractAllTo(artifactDir, true);
            console.log(`✅ Artifact extracted to ${artifactDir}`);

            // List extracted contents
            console.log('\nExtracted files:');
            const listDir = (dir, prefix = '') => {
              try {
                const files = fs.readdirSync(dir);
                files.forEach(file => {
                  const filePath = path.join(dir, file);
                  const stat = fs.statSync(filePath);
                  console.log(`  ${prefix}${file}${stat.isDirectory() ? '/' : ''}`);
                  if (stat.isDirectory() && prefix.length < 4) {
                    listDir(filePath, prefix + '  ');
                  }
                });
              } catch (e) {
                console.log(`  ${prefix}[error reading directory]`);
              }
            };
            listDir(artifactDir);

            console.log('\n✅ Artifact download and extraction complete');
            core.setOutput('success', 'true');
            core.setOutput('artifact-name', scaArtifact.name);

          } catch (error) {
            console.log(`\n❌ Error: ${error.message}`);
            core.setOutput('success', 'false');
          }

    - name: Check out to get veracode CLI
      uses: actions/checkout@v4
      with:
        path: 'veracode-helper'
        fetch-depth: 0
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          helper/cli/*

    - name: Set up CLI (Linux/macOS)
      id: cli-setup-unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd veracode-helper/helper/cli
        cliFile=$(ls -1 *.tar.gz | head -n 1)
        cliFileName=$(echo "$cliFile" | cut -c 1-$((${#cliFile}-7)))
        tar -zxvf $cliFile
        cd $cliFileName
        current_path=$(pwd)
        echo "cli-path=$current_path" >> $GITHUB_OUTPUT

    - name: Set up CLI (Windows)
      id: cli-setup-windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cd veracode-helper/helper/cli
        $cliFile = Get-ChildItem -Filter "veracode-cli_*.ps1" | Select-Object -First 1 -ExpandProperty Name
        & .\$cliFile
        $current_path = "$env:APPDATA\veracode"
        echo "cli-path=$current_path" >> $env:GITHUB_OUTPUT

    - name: Configure git for LF line endings (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        git config --global core.eol lf
        git config --global core.autocrlf false

    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.client_payload.repository.full_name }}
        ref: ${{ github.event.client_payload.repository.branch }}
        token: ${{ github.event.client_payload.token }}
        path: 'source-code'

    - name: Check if SCA results exist
      id: check-sca-results
      run: |
        has_results="false"

        echo "📋 Checking artifact contents for actual SCA results..."
        echo ""
        ls -la ./veracode_artifact_directory/ 2>/dev/null || echo "Artifact directory not found"
        echo ""

        # Look for actual SCA result files (not just metadata)
        if [ -d "./veracode_artifact_directory/.srcclr" ]; then
          if [ -n "$(find ./veracode_artifact_directory/.srcclr -type f 2>/dev/null)" ]; then
            echo "✅ Found .srcclr directory with files"
            has_results="true"
          fi
        fi

        if [ -d "./veracode_artifact_directory/.veracode" ]; then
          if [ -n "$(find ./veracode_artifact_directory/.veracode -type f 2>/dev/null)" ]; then
            echo "✅ Found .veracode directory with files"
            has_results="true"
          fi
        fi

        if [ -f "./veracode_artifact_directory/scaResults.json" ]; then
          echo "✅ Found scaResults.json"
          has_results="true"
        fi

        if [ -f "./veracode_artifact_directory/SBOM.json" ] || [ -f "./veracode_artifact_directory/sbom.json" ]; then
          echo "✅ Found SBOM file"
          has_results="true"
        fi

        if [ "$has_results" = "false" ]; then
          echo "⚠️  No SCA result files found in artifact"
          echo "Artifact contains only metadata (scan may have completed with no findings)"
        fi

        echo "has_results=$has_results" >> $GITHUB_OUTPUT

    - id: run-fix-sca
      if: steps.check-sca-results.outputs.has_results == 'true'
      uses: veracode/veracode-fix-for-sca@v0.1.1
      env:
        VERACODE_API_KEY_ID: '${{ secrets.VERACODE_API_ID }}'
        VERACODE_API_KEY_SECRET: '${{ secrets.VERACODE_API_KEY }}'
        CLI_PATH: ${{ runner.os == 'Windows' && steps.cli-setup-windows.outputs.cli-path || steps.cli-setup-unix.outputs.cli-path }}
      with:
        github-token: ${{ github.event.client_payload.token }}
        pr-number: ${{ github.event.client_payload.issue_number }}
        sca-scan-run-id: ${{ github.event.client_payload.workflow_run_id }}
        sca-scan-artifact-id: ${{ steps.download-artifact.outputs.artifact-name }}
        repository: ${{ github.event.client_payload.repository.full_name }}
        branch: ${{ github.event.client_payload.repository.branch }}
        fix-sca-params: ${{ github.event.client_payload.fix_sca_params || '' }}
        github-api-url: ${{ github.api_url }}

    - name: Info - Fix for SCA skipped - no SCA results available
      if: steps.check-sca-results.outputs.has_results != 'true'
      run: |
        echo "ℹ️  Fix for SCA action was skipped because no SCA scan results were found."
        echo "The Fix for SCA workflow requires pre-existing SCA scan results to generate fixes."
        echo ""
        echo "Artifact downloaded: ${{ steps.download-artifact.outputs.artifact-name }}"

    - name: Download PR comment artifact
      if: steps.check-sca-results.outputs.has_results == 'true' && steps.run-fix-sca.outputs.create-pr-run-next-step == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: veracode-cli-pr-comment-json
        path: ./pr-comment-artifact

    - name: Post comment to original PR
      if: steps.check-sca-results.outputs.has_results == 'true' && steps.run-fix-sca.outputs.create-pr-run-next-step == 'true' && hashFiles('./pr-comment-artifact/veracode-cli.pr-comment.json') != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.event.client_payload.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const filePath = path.join('./pr-comment-artifact', 'veracode-cli.pr-comment.json');

          if (!fs.existsSync(filePath)) {
            core.warning('PR comment artifact not found');
            return;
          }

          const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));

          await github.rest.issues.createComment({
            owner: data.repository_owner,
            repo: data.repository_name,
            issue_number: data.issue_number,
            body: data.body
          });

          core.info(`Comment posted to PR #${data.issue_number}`);
