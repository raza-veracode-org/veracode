name: Veracode Fix for SCA

run-name: Veracode Fix for SCA - ${{ github.event.client_payload.repository.name }}

on:
  repository_dispatch:
    types:
      - veracode-fix-for-sca

jobs:
  cleanup:
    if: github.event_name == 'repository_dispatch'
    uses: ./.github/workflows/veracode-clean-up.yml
    with:
      runs_on: ${{ github.event.client_payload.user_config.default_runs_on }}

  create_metadata:
    if: github.event_name == 'repository_dispatch'
    needs: cleanup
    uses: ./.github/workflows/veracode-metadata.yml
    with:
      event_type: ${{ github.event.client_payload.event_type }}
      repository_name: ${{ github.event.client_payload.repository.name }}
      repository_owner: ${{ github.event.client_payload.repository.owner }}
      pull_request_num: ${{ github.event.client_payload.issue_number }}
      branch: ${{ github.event.client_payload.repository.branch }}
      head_sha: ${{ github.event.client_payload.sha }}

  fix-for-sca-action:
    runs-on: ${{ fromJSON(github.event.client_payload.user_config.default_runs_on) }}
    steps:
    - name: Create artifact directory
      run: mkdir -p ./veracode_artifact_directory

    - name: Build artifact name from workflow run ID
      id: build-artifact-name
      run: |
        ARTIFACT_NAME="sca-scan-results-${{ github.event.client_payload.workflow_run_id }}"
        echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
        echo "Attempting to download artifact with name: $ARTIFACT_NAME"

    - name: List available artifacts in the workflow run
      id: list-artifacts
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.event.client_payload.token }}
        script: |
          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: '${{ github.event.client_payload.repository.owner }}',
            repo: '${{ github.event.client_payload.repository.name }}',
            per_page: 50
          });
          console.log('Available artifacts:');
          artifacts.data.artifacts.forEach(artifact => {
            console.log(`- ${artifact.name} (ID: ${artifact.id}, expires: ${artifact.expires_at})`);
          });

          const matchingArtifact = artifacts.data.artifacts.find(a =>
            a.name === 'sca-scan-results-${{ github.event.client_payload.workflow_run_id }}'
          );

          if (matchingArtifact) {
            core.setOutput('artifact-exists', 'true');
            core.setOutput('artifact-id', matchingArtifact.id);
            console.log(`Found matching artifact: ${matchingArtifact.name}`);
          } else {
            core.setOutput('artifact-exists', 'false');
            console.log('Matching artifact not found');
          }

    - name: Download SCA scan artifact
      if: steps.list-artifacts.outputs.artifact-exists == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.event.client_payload.token }}
        run-id: ${{ github.event.client_payload.workflow_run_id }}
        name: ${{ steps.build-artifact-name.outputs.artifact-name }}
        path: ./veracode_artifact_directory

    - name: Check out to get veracode CLI
      uses: actions/checkout@v4
      with:
        path: 'veracode-helper'
        fetch-depth: 0
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          helper/cli/*

    - name: Set up CLI (Linux/macOS)
      id: cli-setup-unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd veracode-helper/helper/cli
        cliFile=$(ls -1 *.tar.gz | head -n 1)
        cliFileName=$(echo "$cliFile" | cut -c 1-$((${#cliFile}-7)))
        tar -zxvf $cliFile
        cd $cliFileName
        current_path=$(pwd)
        echo "cli-path=$current_path" >> $GITHUB_OUTPUT

    - name: Set up CLI (Windows)
      id: cli-setup-windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cd veracode-helper/helper/cli
        $cliFile = Get-ChildItem -Filter "veracode-cli_*.ps1" | Select-Object -First 1 -ExpandProperty Name
        & .\$cliFile
        $current_path = "$env:APPDATA\veracode"
        echo "cli-path=$current_path" >> $env:GITHUB_OUTPUT

    - name: Configure git for LF line endings (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        git config --global core.eol lf
        git config --global core.autocrlf false

    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.client_payload.repository.full_name }}
        ref: ${{ github.event.client_payload.repository.branch }}
        token: ${{ github.event.client_payload.token }}
        path: 'source-code'

    - name: Debug - Show artifact info and check for SCA results files
      run: |
        echo "workflow_run_id: ${{ github.event.client_payload.workflow_run_id }}"
        echo "artifact_name: ${{ steps.build-artifact-name.outputs.artifact-name }}"
        echo ""
        echo "Checking for SCA results files in veracode_artifact_directory..."
        find ./veracode_artifact_directory -type f 2>/dev/null | head -20
        echo ""
        echo "Checking for SCA results in source code directory..."
        find ./source-code -type f -name "*scaResults*" -o -name "SBOM*" -o -name ".srcclr" 2>/dev/null | head -20

    - name: Check if SCA results exist
      id: check-sca-results
      run: |
        has_results="false"

        # Look for SCA results file in artifact directory
        if find ./veracode_artifact_directory -name "scaResults.json" 2>/dev/null | grep -q .; then
          echo "Found scaResults.json in artifact directory"
          has_results="true"
        fi

        # Look for SBOM files
        if find ./veracode_artifact_directory -name "SBOM.json" -o -name "sbom.json" 2>/dev/null | grep -q .; then
          echo "Found SBOM file in artifact directory"
          has_results="true"
        fi

        # Look for .srcclr or .veracode directories (SCA output)
        if [ -d "./veracode_artifact_directory/.srcclr" ] || [ -d "./veracode_artifact_directory/.veracode" ]; then
          echo "Found SCA output directories"
          has_results="true"
        fi

        # Check for empty marker (no SCA results)
        if [ -f "./veracode_artifact_directory/sca-status.json" ]; then
          echo "Found SCA status marker (likely no results)"
          has_results="false"
        fi

        if [ "$has_results" = "false" ]; then
          echo "WARNING: No SCA results found in artifact directory - checking source code..."
          if find ./source-code -name "scaResults.json" 2>/dev/null | grep -q .; then
            echo "Found scaResults.json in source code directory"
            has_results="true"
          fi
        fi

        echo "has_results=$has_results" >> $GITHUB_OUTPUT

    - id: run-fix-sca
      if: steps.check-sca-results.outputs.has_results == 'true'
      uses: veracode/veracode-fix-for-sca@v0.1.1
      env:
        VERACODE_API_KEY_ID: '${{ secrets.VERACODE_API_ID }}'
        VERACODE_API_KEY_SECRET: '${{ secrets.VERACODE_API_KEY }}'
        CLI_PATH: ${{ runner.os == 'Windows' && steps.cli-setup-windows.outputs.cli-path || steps.cli-setup-unix.outputs.cli-path }}
      with:
        github-token: ${{ github.event.client_payload.token }}
        pr-number: ${{ github.event.client_payload.issue_number }}
        sca-scan-run-id: ${{ github.event.client_payload.workflow_run_id }}
        sca-scan-artifact-id: ${{ steps.build-artifact-name.outputs.artifact-name }}
        repository: ${{ github.event.client_payload.repository.full_name }}
        branch: ${{ github.event.client_payload.repository.branch }}
        fix-sca-params: ${{ github.event.client_payload.fix_sca_params || '' }}
        github-api-url: ${{ github.api_url }}

    - name: Info - Fix for SCA skipped - no SCA results available
      if: steps.check-sca-results.outputs.has_results != 'true'
      run: |
        echo "Fix for SCA action was skipped because no SCA scan results were found."
        echo "The Fix for SCA workflow requires pre-existing SCA scan results to generate fixes."
        echo ""
        echo "To use this workflow:"
        echo "1. Ensure SCA scan has completed and produced results"
        echo "2. Verify the artifact was uploaded with the correct name: sca-scan-results-<run-id>"
        echo ""
        echo "Attempted artifact name: ${{ steps.build-artifact-name.outputs.artifact-name }}"

    - name: Download PR comment artifact
      if: steps.check-sca-results.outputs.has_results == 'true' && steps.run-fix-sca.outputs.create-pr-run-next-step == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: veracode-cli-pr-comment-json
        path: ./pr-comment-artifact

    - name: Post comment to original PR
      if: steps.check-sca-results.outputs.has_results == 'true' && steps.run-fix-sca.outputs.create-pr-run-next-step == 'true' && hashFiles('./pr-comment-artifact/veracode-cli.pr-comment.json') != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ github.event.client_payload.token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const filePath = path.join('./pr-comment-artifact', 'veracode-cli.pr-comment.json');

          if (!fs.existsSync(filePath)) {
            core.warning('PR comment artifact not found');
            return;
          }

          const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));

          await github.rest.issues.createComment({
            owner: data.repository_owner,
            repo: data.repository_name,
            issue_number: data.issue_number,
            body: data.body
          });

          core.info(`Comment posted to PR #${data.issue_number}`);
